name: db-migrate

# Creates and updates the database tables by applying prisma/migrations to the
# database the Cloudflare Worker uses.
#
# Setup (once): GitHub → Settings → Secrets and variables → Actions →
# New repository secret, name DATABASE_URL, value = the same connection string
# as the Worker's DATABASE_URL secret in Cloudflare.
#
# Runs on every push to main that changes the schema or migrations, and on
# demand from the Actions tab ("Run workflow"). `migrate deploy` only applies
# migrations that have not run yet, so re-running it is safe.

on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check that DATABASE_URL is set
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::The DATABASE_URL repository secret is not set, so no migrations were applied. Add it under Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Show pending migrations
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run prisma7 -- migrate status || true

      - name: Apply migrations
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:deploy
